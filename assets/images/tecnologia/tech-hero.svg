<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040b1e"/>
      <stop offset=".45" stop-color="#0a1c3d"/>
      <stop offset="1" stop-color="#120b2b"/>
    </linearGradient>
    <radialGradient id="brilhoCiano" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#37e6ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#37e6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoRoxo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4de8ff" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#4de8ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dc9a"/>
      <stop offset="1" stop-color="#b8863b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowForte" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="malha" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#4de8ff" stroke-opacity=".1" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#4de8ff" fill-opacity=".2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#fundo)"/>
  <rect width="1600" height="900" fill="url(#malha)" opacity=".8"/>
  <ellipse cx="320" cy="190" rx="520" ry="420" fill="url(#brilhoCiano)"/>
  <ellipse cx="1300" cy="700" rx="560" ry="430" fill="url(#brilhoRoxo)"/>
  <ellipse cx="820" cy="450" rx="640" ry="320" fill="#0d2b55" opacity=".35"/>

  <g fill="none" stroke="url(#traco)" stroke-width="1.5" opacity=".75">
    <path d="M0 690H210l60-60h180l50 50h230"/>
    <path d="M0 742H166l74-74h214l46 46h280"/>
    <path d="M1600 170h-190l-70 70h-160l-56-56h-190"/>
    <path d="M1600 236h-140l-88 88h-210l-50-50h-164"/>
    <path d="M120 900V760l80-80h170l70-70h230"/>
    <path d="M1480 900V790l-90-90h-180l-60 60h-250"/>
  </g>

  <g opacity=".9" filter="url(#glow)">
    <circle cx="210" cy="690" r="4" fill="#4de8ff"/>
    <circle cx="450" cy="630" r="3" fill="#4de8ff"/>
    <circle cx="680" cy="680" r="4" fill="#a78bfa"/>
    <circle cx="1400" cy="240" r="4" fill="#4de8ff"/>
    <circle cx="1180" cy="260" r="3" fill="#a78bfa"/>
    <circle cx="940" cy="184" r="4" fill="#f4dc9a"/>
  </g>

  <!-- Portal esquerdo: rede de conhecimento -->
  <g transform="translate(180 188)">
    <circle cx="150" cy="250" r="188" fill="#06152f" fill-opacity=".55" stroke="#4de8ff" stroke-opacity=".42" stroke-width="2"/>
    <circle cx="150" cy="250" r="150" fill="none" stroke="#4de8ff" stroke-opacity=".18" stroke-width="1" stroke-dasharray="6 12"/>
    <g stroke="#4de8ff" stroke-opacity=".55" stroke-width="1.4" fill="none">
      <path d="M62 198 116 162 172 196 224 154 246 226 190 276 132 246 78 284 62 198Z"/>
      <path d="M116 162 132 246 246 226M172 196 190 276M78 284 132 246 190 276"/>
    </g>
    <g fill="#4de8ff" filter="url(#glow)">
      <circle cx="62" cy="198" r="7"/><circle cx="116" cy="162" r="6"/><circle cx="172" cy="196" r="8"/>
      <circle cx="224" cy="154" r="6"/><circle cx="246" cy="226" r="7"/><circle cx="190" cy="276" r="8"/>
      <circle cx="132" cy="246" r="9"/><circle cx="78" cy="284" r="6"/>
    </g>
  </g>

  <!-- Portal central: arco da evolução -->
  <g transform="translate(570 128)">
    <path d="M40 520V300C40 148 160 40 310 40s270 108 270 260v220" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="3"/>
    <path d="M82 520V306C82 174 184 82 310 82s228 92 228 224v214" fill="none" stroke="#4de8ff" stroke-opacity=".28" stroke-width="2"/>
    <g fill="none" stroke="#e8c46a" stroke-opacity=".55" stroke-width="2">
      <circle cx="310" cy="286" r="146"/>
      <circle cx="310" cy="286" r="106" stroke-dasharray="3 10"/>
    </g>
    <g filter="url(#glowForte)">
      <circle cx="310" cy="286" r="18" fill="#e8c46a"/>
      <circle cx="310" cy="140" r="7" fill="#4de8ff"/>
      <circle cx="456" cy="286" r="7" fill="#4de8ff"/>
      <circle cx="310" cy="432" r="7" fill="#a78bfa"/>
      <circle cx="164" cy="286" r="7" fill="#a78bfa"/>
    </g>
    <g stroke="#4de8ff" stroke-opacity=".35" stroke-width="1.2">
      <path d="M310 140v128m0 36v128M164 286h128m36 0h128"/>
    </g>
    <g fill="#e8c46a" opacity=".8">
      <circle cx="234" cy="210" r="3"/><circle cx="386" cy="210" r="3"/>
      <circle cx="234" cy="362" r="3"/><circle cx="386" cy="362" r="3"/>
    </g>
  </g>

  <!-- Portal direito: engenharia robótica -->
  <g transform="translate(1110 170)">
    <circle cx="180" cy="270" r="190" fill="#0b1233" fill-opacity=".55" stroke="#a78bfa" stroke-opacity=".4" stroke-width="2"/>
    <circle cx="180" cy="270" r="148" fill="none" stroke="#a78bfa" stroke-opacity=".18" stroke-dasharray="5 13"/>
    <g fill="none" stroke="#cbd5f5" stroke-opacity=".7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 372h92l44-74 70-30"/>
      <path d="M210 298l34 44 58 8"/>
    </g>
    <g fill="#a78bfa" stroke="#e8c46a" stroke-opacity=".6" stroke-width="2">
      <circle cx="96" cy="372" r="18"/><circle cx="188" cy="372" r="16"/><circle cx="232" cy="298" r="19"/>
      <circle cx="302" cy="268" r="13"/>
    </g>
    <g fill="#4de8ff" filter="url(#glow)">
      <circle cx="302" cy="268" r="5"/><circle cx="232" cy="298" r="4"/><circle cx="188" cy="372" r="4"/>
    </g>
    <path d="M292 256l22 24m-16-32 22 24" stroke="#e8c46a" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Poeira luminosa -->
  <g fill="#f4dc9a">
    <circle cx="95" cy="118" r="2" opacity=".55"/><circle cx="520" cy="92" r="2.5" opacity=".4"/>
    <circle cx="980" cy="92" r="2" opacity=".5"/><circle cx="1510" cy="530" r="2.4" opacity=".45"/>
    <circle cx="760" cy="820" r="2" opacity=".45"/><circle cx="1240" cy="805" r="2.6" opacity=".4"/>
    <circle cx="420" cy="760" r="1.8" opacity=".5"/><circle cx="1050" cy="700" r="2" opacity=".35"/>
  </g>

  <path d="M0 900h1600" stroke="#4de8ff" stroke-opacity=".16" stroke-width="2"/>
</svg>
