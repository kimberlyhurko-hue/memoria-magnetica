<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2118"/><stop offset=".28" stop-color="#3c2e1e"/>
      <stop offset=".55" stop-color="#172548"/><stop offset=".78" stop-color="#0c2350"/><stop offset="1" stop-color="#0a1638"/>
    </linearGradient>
    <radialGradient id="fogo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb85c" stop-opacity=".55"/><stop offset="1" stop-color="#ffb85c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="futuro" cx="50%" cy="50%" r="50%">
