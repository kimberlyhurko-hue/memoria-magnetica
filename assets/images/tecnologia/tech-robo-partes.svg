<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060d27"/><stop offset="1" stop-color="#17103a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe6f7"/><stop offset=".5" stop-color="#6f81a5"/><stop offset="1" stop-color="#26324f"/>
    </linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4de8ff" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#f)"/>
  <rect width="1200" height="800" fill="url(#p)"/>
  <g fill="none" stroke="#4de8ff" stroke-opacity=".12">
    <circle cx="600" cy="400" r="320"/><circle cx="600" cy="400" r="250" stroke-dasharray="4 12"/>
  </g>

  <!-- Robô esquemático -->
  <g transform="translate(420 170)" stroke-linejoin="round">
    <rect x="130" y="330" width="180" height="70" rx="18" fill="#1a2746" stroke="url(#metal)" stroke-width="3"/>
    <rect x="150" y="120" width="140" height="210" rx="30" fill="url(#metal)" stroke="#e8c46a" stroke-opacity=".5" stroke-width="2"/>
    <rect x="176" y="150" width="88" height="62" rx="14" fill="#08172f" stroke="#4de8ff" stroke-width="3"/>
    <circle cx="200" cy="181" r="8" fill="#4de8ff" filter="url(#g)"/><circle cx="240" cy="181" r="8" fill="#4de8ff" filter="url(#g)"/>
    <path d="M196 216h48" stroke="#4de8ff" stroke-width="3" stroke-linecap="round"/>
    <g fill="url(#metal)" stroke="#e8c46a" stroke-opacity=".5" stroke-width="2">
      <circle cx="150" cy="152" r="22"/><circle cx="290" cy="152" r="22"/>
      <circle cx="150" cy="250" r="22"/><circle cx="290" cy="250" r="22"/>
    </g>
    <path d="M150 152 52 220l-6 90" fill="none" stroke="url(#metal)" stroke-width="26" stroke-linecap="round"/>
    <path d="M290 152 392 220l6 90" fill="none" stroke="url(#metal)" stroke-width="26" stroke-linecap="round"/>
    <path d="M150 250 76 330M290 250l74 80" fill="none" stroke="url(#metal)" stroke-width="20" stroke-linecap="round"/>
    <g fill="#a78bfa" stroke="#e8c46a" stroke-opacity=".5" stroke-width="2">
      <path d="M34 300h24l-4 34H30z"/><path d="M390 300h24l8 34h-28z"/>
      <rect x="58" y="326" width="40" height="22" rx="8"/><rect x="350" y="326" width="40" height="22" rx="8"/>
    </g>
    <g fill="none" stroke="#4de8ff" stroke-opacity=".6" stroke-width="3">
      <circle cx="46" cy="310" r="10"/><circle cx="402" cy="310" r="10"/>
    </g>
    <rect x="164" y="236" width="112" height="58" rx="12" fill="#08172f" stroke="#a78bfa" stroke-width="2"/>
    <g stroke="#4de8ff" stroke-width="2" opacity=".8">
      <path d="M180 252h24l8-8h20M180 274h34l10 8h26"/>
    </g>
  </g>

  <!-- Marcadores numerados -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g transform="translate(760 250)"><circle r="24" fill="#e8c46a" color="#08172f"/><text y="8" fill="#08172f">1</text></g>
    <g transform="translate(760 364)"><circle r="24" fill="#4de8ff"/><text y="8" fill="#06142c">2</text></g>
    <g transform="translate(760 470)"><circle r="24" fill="#a78bfa"/><text y="8" fill="#100b2c">3</text></g>
    <g transform="translate(410 250)"><circle r="24" fill="#4de8ff"/><text y="8" fill="#06142c">4</text></g>
    <g transform="translate(410 470)"><circle r="24" fill="#a78bfa"/><text y="8" fill="#100b2c">5</text></g>
    <g transform="translate(600 640)"><circle r="24" fill="#e8c46a"/><text y="8" fill="#08172f">6</text></g>
  </g>

  <g stroke="#4de8ff" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 7">
    <path d="M784 250H930M784 364H930M784 470H930M410 250H270M410 470H270M600 640V560"/>
  </g>
</svg>
