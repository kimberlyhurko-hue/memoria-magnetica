<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b23"/><stop offset=".5" stop-color="#111a42"/><stop offset="1" stop-color="#1a1038"/>
    </linearGradient>
    <radialGradient id="r" cx="70%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8b5cff" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e2f5"/><stop offset=".45" stop-color="#6b7d9e"/><stop offset="1" stop-color="#273453"/>
    </linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="p" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4de8ff" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="1.4" fill="#4de8ff" fill-opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#f)"/>
  <rect width="1200" height="800" fill="url(#p)"/>
  <ellipse cx="900" cy="320" rx="470" ry="370" fill="url(#r)"/>

  <g fill="none" stroke="#4de8ff" stroke-opacity=".14">
    <circle cx="600" cy="390" r="300"/><circle cx="600" cy="390" r="220" stroke-dasharray="5 14"/>
    <path d="M0 620h1200M0 680h1200"/>
  </g>

  <!-- Mesa de trabalho -->
  <g transform="translate(80 540)">
    <rect x="0" y="0" width="620" height="34" rx="10" fill="#1c2948" stroke="#8b5cff" stroke-opacity=".45" stroke-width="2"/>
    <rect x="40" y="34" width="18" height="150" fill="#273453"/><rect x="562" y="34" width="18" height="150" fill="#273453"/>
    <g fill="#0a1530" stroke="#4de8ff" stroke-opacity=".35">
      <rect x="88" y="-50" width="120" height="50" rx="8"/>
      <rect x="240" y="-38" width="90" height="38" rx="8"/>
    </g>
    <g stroke="#4de8ff" stroke-opacity=".65" stroke-width="2" fill="none">
      <path d="M104 -30h30l10-12h50M256 -20h24l12 10h28"/>
    </g>
    <g fill="#8b5cff" filter="url(#g)"><circle cx="144" cy="-42" r="5"/><circle cx="292" cy="-10" r="5"/></g>
    <g fill="none" stroke="#e8c46a" stroke-opacity=".55" stroke-width="3">
      <circle cx="430" cy="-24" r="26" stroke-dasharray="8 6"/>
      <circle cx="490" cy="-18" r="18" stroke-dasharray="6 5"/>
    </g>
  </g>

  <!-- Braço robótico -->
  <g transform="translate(690 150)" stroke-linejoin="round">
    <rect x="0" y="360" width="150" height="90" rx="16" fill="#1c2948" stroke="url(#metal)" stroke-opacity=".7" stroke-width="3"/>
    <circle cx="76" cy="360" r="42" fill="url(#metal)" stroke="#e8c46a" stroke-opacity=".6" stroke-width="3"/>
    <circle cx="76" cy="360" r="17" fill="#0a1530" stroke="#4de8ff" stroke-width="3"/>
    <path d="M76 340V190l96-70" fill="none" stroke="url(#metal)" stroke-width="34" stroke-linecap="round"/>
    <path d="M76 340V190l96-70" fill="none" stroke="#4de8ff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
    <circle cx="76" cy="190" r="30" fill="url(#metal)" stroke="#e8c46a" stroke-opacity=".6" stroke-width="3"/>
    <circle cx="76" cy="190" r="12" fill="#0a1530" stroke="#4de8ff" stroke-width="3"/>
    <circle cx="172" cy="120" r="28" fill="url(#metal)" stroke="#e8c46a" stroke-opacity=".6" stroke-width="3"/>
    <path d="M172 120l70 44" fill="none" stroke="url(#metal)" stroke-width="24" stroke-linecap="round"/>
    <g fill="url(#metal)" stroke="#e8c46a" stroke-opacity=".6" stroke-width="2">
      <path d="M234 154l38 18-10 22-40-18z"/><path d="M232 184l34 22-12 20-34-22z"/>
    </g>
    <g fill="#4de8ff" filter="url(#g)">
      <circle cx="76" cy="360" r="7"/><circle cx="76" cy="190" r="6"/><circle cx="172" cy="120" r="6"/><circle cx="264" cy="182" r="5"/>
    </g>
  </g>

  <!-- Sensores e protótipos -->
  <g transform="translate(120 130)">
    <g fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-width="2">
      <rect x="0" y="0" width="150" height="110" rx="14"/>
      <circle cx="75" cy="55" r="30"/><circle cx="75" cy="55" r="42" stroke-dasharray="4 8"/>
    </g>
    <circle cx="75" cy="55" r="12" fill="#4de8ff" filter="url(#g)"/>
    <path d="M75 55 140 18M75 55 36 100" stroke="#4de8ff" stroke-opacity=".5" stroke-width="2"/>
    <g transform="translate(0 160)" fill="none" stroke="#4de8ff" stroke-opacity=".5" stroke-width="2">
      <path d="M0 40h50l20-30h50l20 30h40"/>
      <circle cx="70" cy="10" r="5" fill="#4de8ff"/><circle cx="140" cy="10" r="5" fill="#4de8ff"/>
      <rect x="0" y="28" width="180" height="24" rx="6"/>
    </g>
