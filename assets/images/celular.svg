<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Universo microscópico ilustrado com células e estruturas orgânicas">
  <defs>
    <radialGradient id="bg" cx="42%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2c5c40"/><stop offset="0.5" stop-color="#173d2c"/><stop offset="1" stop-color="#0a1f1a"/>
    </radialGradient>
    <radialGradient id="cellFill" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#a9d2a0" stop-opacity="0.38"/><stop offset="0.6" stop-color="#4f8a5e" stop-opacity="0.22"/><stop offset="1" stop-color="#183d2b" stop-opacity="0.08"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#e7cf94"/><stop offset="0.55" stop-color="#a88c4e"/><stop offset="1" stop-color="#5b5a2f"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6e0a5"/><stop offset="1" stop-color="#C6A76B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="tiny"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#C6A76B" opacity="0.16" filter="url(#soft)">
    <ellipse cx="330" cy="220" rx="260" ry="200"/><ellipse cx="1260" cy="700" rx="300" ry="220"/>
  </g>

  <!-- membranas translúcidas -->
  <g stroke="#9fc7a0" fill="url(#cellFill)">
    <ellipse cx="420" cy="430" rx="300" ry="260" stroke-width="5" opacity="0.8"/>
    <ellipse cx="420" cy="430" rx="278" ry="240" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="1080" cy="300" rx="220" ry="190" stroke-width="4" opacity="0.65"/>
    <ellipse cx="1290" cy="700" rx="250" ry="210" stroke-width="4" opacity="0.6"/>
    <ellipse cx="790" cy="760" rx="180" ry="140" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- núcleos -->
  <g>
    <circle cx="450" cy="410" r="95" fill="url(#nucleus)" opacity="0.9"/>
    <circle cx="450" cy="410" r="62" fill="#c9ab6a" opacity="0.45"/>
    <circle cx="430" cy="388" r="20" fill="#f0d99c" opacity="0.75"/>
    <circle cx="1085" cy="300" r="58" fill="url(#nucleus)" opacity="0.8"/>
    <circle cx="1300" cy="700" r="70" fill="url(#nucleus)" opacity="0.75"/>
    <circle cx="790" cy="760" r="42" fill="url(#nucleus)" opacity="0.7"/>
  </g>

  <!-- organelas e vesículas -->
  <g fill="none" stroke="#cfe3b6" stroke-width="2" opacity="0.55">
    <ellipse cx="300" cy="560" rx="52" ry="20" transform="rotate(-25 300 560)"/>
    <ellipse cx="560" cy="300" rx="46" ry="18" transform="rotate(30 560 300)"/>
    <ellipse cx="1010" cy="440" rx="40" ry="16" transform="rotate(-15 1010 440)"/>
    <ellipse cx="1180" cy="620" rx="48" ry="18" transform="rotate(35 1180 620)"/>
    <path d="M250 300 Q300 250 350 290 M980 210 Q1030 170 1080 200 M700 520 Q750 480 800 510"/>
  </g>
  <g fill="#e7d29c" opacity="0.65">
    <circle cx="350" cy="250" r="6"/><circle cx="600" cy="520" r="5"/><circle cx="940" cy="640" r="6"/>
    <circle cx="1200" cy="400" r="5"/><circle cx="700" cy="180" r="4"/><circle cx="1400" cy="520" r="5"/>
  </g>

  <!-- cadeia molecular estilizada -->
  <g stroke="#d9e7bd" stroke-width="3" fill="none" opacity="0.35">
    <path d="M760 120 L820 180 L900 160 L960 220 L1040 200"/>
    <path d="M200 740 L260 680 L340 720 L400 670 L470 700"/>
  </g>
  <g fill="#f4e6b8" opacity="0.7">
    <circle cx="760" cy="120" r="9"/><circle cx="820" cy="180" r="7"/><circle cx="900" cy="160" r="10"/>
    <circle cx="960" cy="220" r="7"/><circle cx="1040" cy="200" r="9"/>
    <circle cx="200" cy="740" r="8"/><circle cx="260" cy="680" r="6"/><circle cx="340" cy="720" r="9"/>
    <circle cx="400" cy="670" r="6"/><circle cx="470" cy="700" r="8"/>
  </g>

  <!-- pontos luminosos -->
  <g>
    <circle cx="180" cy="200" r="34" fill="url(#gold)" opacity="0.7"/>
    <circle cx="700" cy="400" r="28" fill="url(#gold)" opacity="0.5"/>
    <circle cx="1360" cy="250" r="30" fill="url(#gold)" opacity="0.6"/>
    <circle cx="950" cy="820" r="26" fill="url(#gold)" opacity="0.5"/>
  </g>
  <g fill="#f7edcb">
    <circle cx="120" cy="360" r="2.5" opacity="0.8"/><circle cx="640" cy="140" r="2" opacity="0.7"/>
    <circle cx="880" cy="340" r="2.6" opacity="0.85"/><circle cx="1150" cy="160" r="2" opacity="0.7"/>
    <circle cx="1480" cy="420" r="2.4" opacity="0.75"/><circle cx="540" cy="820" r="2" opacity="0.7"/>
    <circle cx="700" cy="640" r="2.2" opacity="0.8"/><circle cx="1000" cy="100" r="1.8" opacity="0.6"/>
  </g>
</svg>
