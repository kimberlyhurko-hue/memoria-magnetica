<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sala de estudos antiga com livro aberto, fotografias e objetos pessoais">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76533A"/><stop offset="0.5" stop-color="#5a3f2c"/><stop offset="1" stop-color="#33261c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="20%" r="60%">
      <stop offset="0" stop-color="#f6dca0" stop-opacity="0.7"/><stop offset="1" stop-color="#C6A76B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6b43"/><stop offset="1" stop-color="#5b3a25"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecd2"/><stop offset="1" stop-color="#d8c49d"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="tiny"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#lamp)" opacity="0.55"/>

  <!-- janela com luz -->
  <g>
    <rect x="1120" y="90" width="360" height="440" rx="8" fill="#e9d7a3" opacity="0.85"/>
    <rect x="1136" y="106" width="328" height="408" rx="4" fill="#f5e6bd"/>
    <path d="M1300 106 V514 M1136 310 H1464" stroke="#76533A" stroke-width="14"/>
    <path d="M1120 90 L1600 90 L1600 700 L1300 530Z" fill="#fff0c4" opacity="0.18"/>
  </g>
  <g fill="#fff0c4" opacity="0.12">
    <path d="M1200 120 L1450 120 L1600 900 L1180 900Z"/>
  </g>

  <!-- estantes -->
  <g fill="#4a3223">
    <rect x="70" y="90" width="430" height="500" rx="6"/>
    <rect x="70" y="290" width="430" height="18"/>
    <rect x="70" y="490" width="430" height="18"/>
  </g>
  <g>
    <g fill="#a47746"><rect x="92" y="120" width="26" height="160"/><rect x="128" y="140" width="20" height="140"/><rect x="158" y="110" width="30" height="170"/><rect x="200" y="150" width="22" height="130"/><rect x="234" y="124" width="28" height="156"/></g>
    <g fill="#8b5f3c"><rect x="280" y="134" width="24" height="146"/><rect x="316" y="118" width="32" height="162"/><rect x="360" y="146" width="20" height="134"/><rect x="392" y="126" width="28" height="154"/><rect x="432" y="142" width="22" height="138"/><rect x="462" y="120" width="26" height="160"/></g>
    <g fill="#b48a52"><rect x="92" y="320" width="28" height="160"/><rect x="132" y="340" width="22" height="140"/><rect x="166" y="312" width="32" height="168"/><rect x="210" y="348" width="20" height="132"/><rect x="242" y="326" width="26" height="154"/></g>
    <g fill="#765033"><rect x="286" y="336" width="26" height="144"/><rect x="324" y="314" width="30" height="166"/><rect x="368" y="344" width="22" height="136"/><rect x="402" y="330" width="24" height="150"/><rect x="440" y="320" width="30" height="160"/></g>
  </g>

  <!-- mesa -->
  <path d="M110 660 Q800 610 1500 660 L1560 900 L60 900Z" fill="url(#desk)"/>
  <path d="M110 660 Q800 610 1500 660 L1490 690 Q800 644 120 690Z" fill="#b17e4f" opacity="0.7"/>

  <!-- livro aberto -->
  <g transform="translate(560 620) rotate(-4)">
    <path d="M0 90 Q140 20 230 70 L230 210 Q130 165 0 230Z" fill="url(#page)" stroke="#a47746" stroke-width="3"/>
    <path d="M460 90 Q320 20 230 70 L230 210 Q330 165 460 230Z" fill="url(#page)" stroke="#a47746" stroke-width="3"/>
    <path d="M230 70 V210" stroke="#76533A" stroke-width="6"/>
    <g stroke="#9b855f" stroke-width="2.5" opacity="0.7" stroke-linecap="round">
      <path d="M30 110 Q130 70 200 106 M30 136 Q130 96 200 132 M30 162 Q130 122 200 158 M30 188 Q130 148 200 184"/>
      <path d="M260 106 Q330 70 430 110 M260 132 Q330 96 430 136 M260 158 Q330 122 430 162 M260 184 Q330 148 430 188"/>
    </g>
  </g>

  <!-- fotografias e papéis -->
  <g transform="translate(1030 690) rotate(8)">
    <rect width="150" height="110" fill="#f1e5c8" stroke="#8b6b48" stroke-width="3"/>
    <rect x="12" y="12" width="126" height="66" fill="#8ba08a"/>
    <circle cx="52" cy="42" r="16" fill="#d9c9a2"/><path d="M18 78 Q52 48 86 78Z" fill="#5d735f"/>
    <path d="M16 94 H120" stroke="#9b855f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(300 720) rotate(-9)" opacity="0.9">
    <rect width="170" height="120" fill="#e8d8b4" stroke="#9b855f" stroke-width="2"/>
    <path d="M18 28 H140 M18 52 H150 M18 76 H120 M18 100 H140" stroke="#a08b64" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- luminária -->
  <g transform="translate(1330 470)">
    <path d="M60 0 L30 170 H170 L140 0Z" fill="#b48a52"/>
    <ellipse cx="100" cy="172" rx="70" ry="16" fill="#f6dca0" opacity="0.9"/>
    <path d="M100 172 L-60 430 L280 430Z" fill="#f6dca0" opacity="0.12"/>
    <rect x="94" y="170" width="12" height="120" fill="#765033"/>
    <ellipse cx="100" cy="300" rx="60" ry="14" fill="#765033"/>
  </g>

  <!-- pó luminoso -->
  <g fill="#fff0c4">
    <circle cx="250" cy="260" r="2.5" opacity="0.7"/><circle cx="680" cy="200" r="2" opacity="0.6"/>
    <circle cx="900" cy="380" r="3" opacity="0.7"/><circle cx="1080" cy="180" r="2.4" opacity="0.65"/>
    <circle cx="1420" cy="560" r="2.6" opacity="0.8"/><circle cx="740" cy="500" r="2" opacity="0.55"/>
    <circle cx="480" cy="560" r="2.2" opacity="0.6"/><circle cx="1520" cy="330" r="2" opacity="0.6"/>
  </g>
  <g fill="#ffe9b0" opacity="0.25" filter="url(#tiny)">
    <circle cx="900" cy="380" r="18"/><circle cx="1420" cy="560" r="16"/><circle cx="250" cy="260" r="14"/>
  </g>
</svg>
