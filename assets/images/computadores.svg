<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Universo digital com painéis holográficos e caminhos de dados">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101C36"/><stop offset="0.5" stop-color="#172F55"/><stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8ADCF0" stop-opacity="0.75"/><stop offset="0.3" stop-color="#399BC0" stop-opacity="0.3"/><stop offset="1" stop-color="#399BC0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ADCF0" stop-opacity="0.2"/><stop offset="1" stop-color="#235B85" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ADCF0" stop-opacity="0"/><stop offset="0.5" stop-color="#8ADCF0" stop-opacity="0.9"/><stop offset="1" stop-color="#8ADCF0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#8ADCF0" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="430" rx="480" ry="420" fill="url(#core)" opacity="0.7"/>

  <!-- grade em perspectiva -->
  <g stroke="#399BC0" stroke-width="2" opacity="0.28">
    <path d="M800 620 L-200 900 M800 620 L100 900 M800 620 L400 900 M800 620 L700 900 M800 620 L900 900 M800 620 L1200 900 M800 620 L1500 900 M800 620 L1800 900"/>
    <path d="M0 700 H1600 M0 780 H1600 M0 860 H1600"/>
  </g>

  <!-- painéis holográficos (sem texto legível) -->
  <g transform="translate(90 150)">
    <rect width="340" height="220" rx="12" fill="url(#panel)" stroke="#8ADCF0" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M28 42 H270 M28 70 H312 M28 98 H228" stroke="#8ADCF0" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
    <rect x="28" y="126" width="120" height="60" rx="6" fill="none" stroke="#8ADCF0" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M40 166 L64 146 L88 158 L112 136 L136 152" fill="none" stroke="#8ADCF0" stroke-opacity="0.7" stroke-width="3"/>
    <circle cx="270" cy="156" r="24" fill="none" stroke="#8ADCF0" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="270" cy="156" r="10" fill="#8ADCF0" opacity="0.35"/>
  </g>
  <g transform="translate(1160 110)">
    <rect width="350" height="240" rx="12" fill="url(#panel)" stroke="#8ADCF0" stroke-opacity="0.45" stroke-width="2"/>
    <g fill="none" stroke="#8ADCF0" stroke-opacity="0.55" stroke-width="2">
      <circle cx="175" cy="110" r="62"/><circle cx="175" cy="110" r="40"/><circle cx="175" cy="110" r="18"/>
      <path d="M175 48 V172 M113 110 H237 M131 66 L219 154 M219 66 L131 154"/>
    </g>
    <path d="M28 206 H322" stroke="#8ADCF0" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(180 560)">
    <rect width="300" height="180" rx="12" fill="url(#panel)" stroke="#8ADCF0" stroke-opacity="0.4" stroke-width="2"/>
    <g fill="#8ADCF0" opacity="0.45">
      <rect x="26" y="30" width="52" height="52" rx="5"/><rect x="92" y="30" width="52" height="52" rx="5"/>
      <rect x="158" y="30" width="52" height="52" rx="5"/><rect x="224" y="30" width="52" height="52" rx="5"/>
    </g>
    <path d="M26 108 H274 M26 132 H220 M26 156 H250" stroke="#8ADCF0" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(1180 560)">
    <rect width="320" height="200" rx="12" fill="url(#panel)" stroke="#8ADCF0" stroke-opacity="0.4" stroke-width="2"/>
    <g stroke="#8ADCF0" stroke-opacity="0.5" stroke-width="3" fill="none">
      <path d="M30 150 L90 90 L150 120 L210 50 L290 80"/>
      <path d="M30 170 H290"/>
    </g>
    <g fill="#8ADCF0" opacity="0.8">
      <circle cx="90" cy="90" r="6"/><circle cx="150" cy="120" r="6"/><circle cx="210" cy="50" r="6"/><circle cx="290" cy="80" r="6"/>
    </g>
  </g>

  <!-- fluxos de dados -->
  <g fill="none" stroke="url(#beam)" stroke-width="4">
    <path d="M430 260 Q620 200 690 380"/>
    <path d="M1160 230 Q960 210 900 380"/>
    <path d="M480 640 Q640 700 700 540"/>
    <path d="M1180 660 Q960 720 900 540"/>
  </g>
  <g fill="#D9EDF5">
    <circle cx="690" cy="380" r="5"/><circle cx="900" cy="380" r="5"/><circle cx="700" cy="540" r="5"/><circle cx="900" cy="540" r="5"/>
  </g>

  <!-- núcleo central: livro de luz -->
  <g transform="translate(800 450)">
    <circle r="150" fill="#8ADCF0" opacity="0.18" filter="url(#glow)"/>
    <g stroke="#8ADCF0" stroke-width="3" fill="#8ADCF0" fill-opacity="0.08">
      <path d="M0 60 Q-70 20 -120 40 L-120 -40 Q-70 -60 0 -20Z"/>
      <path d="M0 60 Q70 20 120 40 L120 -40 Q70 -60 0 -20Z"/>
    </g>
    <path d="M0 -20 V60" stroke="#D9EDF5" stroke-width="4"/>
    <path d="M0 -20 L0 -120 M0 -120 L-30 -150 M0 -120 L30 -150" stroke="#8ADCF0" stroke-width="2" opacity="0.7" fill="none"/>
    <circle cy="-160" r="8" fill="#D9EDF5"/>
  </g>

  <!-- partículas -->
  <g fill="#D9EDF5">
    <circle cx="560" cy="120" r="2.6" opacity="0.8"/><circle cx="1020" cy="90" r="2" opacity="0.7"/>
    <circle cx="1430" cy="470" r="2.4" opacity="0.75"/><circle cx="200" cy="450" r="2" opacity="0.6"/>
    <circle cx="700" cy="820" r="2.6" opacity="0.7"/><circle cx="1080" cy="830" r="2" opacity="0.65"/>
    <circle cx="60" cy="300" r="2" opacity="0.5"/><circle cx="1540" cy="820" r="2.2" opacity="0.6"/>
  </g>
</svg>
