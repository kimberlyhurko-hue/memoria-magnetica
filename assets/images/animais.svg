<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Floresta encantada com trilha, animais e luz do sol">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb98a"/><stop offset="0.45" stop-color="#78936A"/><stop offset="1" stop-color="#315C3B"/>
    </linearGradient>
    <radialGradient id="sun" cx="36%" cy="18%" r="45%">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0.95"/><stop offset="1" stop-color="#C6A76B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6b42"/><stop offset="1" stop-color="#183D2B"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6c9a0" stop-opacity="0.75"/><stop offset="1" stop-color="#a4a878" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- raios -->
  <g fill="#fff3cd" opacity="0.22">
    <path d="M470 0 L540 0 L980 900 L790 900Z"/>
    <path d="M620 0 L665 0 L1220 900 L1060 900Z"/>
    <path d="M330 0 L380 0 L700 900 L580 900Z"/>
  </g>

  <!-- montanhas e folhagem distante -->
  <path d="M0 520 Q200 430 400 500 Q600 410 820 500 Q1040 420 1260 500 Q1440 440 1600 510 L1600 900 L0 900Z" fill="#5c7a58" opacity="0.6"/>
  <g fill="#3f6644" opacity="0.85">
    <ellipse cx="120" cy="440" rx="200" ry="160"/><ellipse cx="380" cy="410" rx="190" ry="150"/>
    <ellipse cx="720" cy="430" rx="220" ry="160"/><ellipse cx="1060" cy="400" rx="200" ry="150"/>
    <ellipse cx="1400" cy="440" rx="230" ry="170"/>
  </g>

  <!-- troncos em camadas -->
  <g fill="#2b4a30">
    <path d="M60 900 L92 120 Q110 96 130 120 L170 900Z"/>
    <path d="M420 900 L444 180 Q460 156 480 180 L512 900Z"/>
    <path d="M1320 900 L1348 140 Q1368 116 1390 140 L1424 900Z"/>
    <path d="M1540 900 L1564 220 Q1580 196 1600 220 L1600 900Z"/>
  </g>
  <g fill="#315C3B">
    <ellipse cx="110" cy="180" rx="190" ry="130"/><ellipse cx="460" cy="230" rx="180" ry="120"/>
    <ellipse cx="1380" cy="190" rx="210" ry="140"/>
  </g>
  <g fill="#78936A" opacity="0.55">
    <ellipse cx="250" cy="140" rx="170" ry="90"/><ellipse cx="1180" cy="160" rx="180" ry="95"/>
  </g>

  <!-- solo e trilha -->
  <path d="M0 680 Q400 620 800 690 Q1200 750 1600 660 L1600 900 L0 900Z" fill="url(#ground)"/>
  <path d="M760 900 Q740 780 800 700 Q860 780 900 900Z" fill="url(#trail)"/>
  <path d="M0 760 Q300 700 560 780 M1040 790 Q1320 710 1600 780" fill="none" stroke="#78936A" stroke-width="8" opacity="0.25"/>

  <!-- riacho -->
  <path d="M60 900 Q180 820 300 860 Q420 900 520 850" fill="none" stroke="#a8cfd0" stroke-width="22" opacity="0.35"/>
  <path d="M60 900 Q180 820 300 860 Q420 900 520 850" fill="none" stroke="#d9edf5" stroke-width="5" opacity="0.45"/>

  <!-- pedras com musgo -->
  <g fill="#4d4b36">
    <ellipse cx="240" cy="790" rx="70" ry="34"/><ellipse cx="1300" cy="800" rx="90" ry="42"/><ellipse cx="1090" cy="850" rx="55" ry="26"/>
  </g>
  <g fill="#78936A" opacity="0.8">
    <ellipse cx="240" cy="774" rx="62" ry="20"/><ellipse cx="1300" cy="782" rx="80" ry="24"/><ellipse cx="1090" cy="840" rx="48" ry="14"/>
  </g>

  <!-- veado ao longe -->
  <g fill="#26402d" opacity="0.9">
    <path d="M980 690 Q990 660 1018 660 L1040 668 Q1052 650 1058 630 L1064 606 L1070 630 Q1076 652 1090 666 L1110 670 Q1124 674 1122 690 L1114 700 L1110 730 L1102 730 L1100 700 L1068 700 L1064 734 L1056 734 L1054 700 Q1024 700 1010 726 L1002 726 L1004 696Z"/>
    <path d="M1058 626 L1046 604 M1058 626 L1070 602 M1068 628 L1080 608" fill="none" stroke="#26402d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- pássaros -->
  <g fill="none" stroke="#2e4a33" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M600 180 Q616 166 632 180 Q648 166 664 180"/>
    <path d="M700 120 Q712 110 724 120 Q736 110 748 120"/>
    <path d="M520 260 Q530 252 540 260 Q550 252 560 260"/>
  </g>

  <!-- flores e vagalumes -->
  <g fill="#e8d08d" opacity="0.85">
    <circle cx="180" cy="740" r="4"/><circle cx="360" cy="810" r="4"/><circle cx="640" cy="760" r="3.5"/>
    <circle cx="980" cy="800" r="4"/><circle cx="1200" cy="740" r="3.5"/><circle cx="1460" cy="820" r="4"/>
    <circle cx="760" cy="620" r="3"/><circle cx="880" cy="560" r="2.6"/>
  </g>
  <g fill="#fff0b8" opacity="0.4" filter="url(#soft)">
    <circle cx="180" cy="740" r="18"/><circle cx="980" cy="800" r="18"/><circle cx="1460" cy="820" r="16"/>
  </g>
</svg>
