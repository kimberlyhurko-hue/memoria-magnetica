<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Medalha com uma bússola dourada e cinco pequenas luzes">
  <defs>
    <radialGradient id="ec-disc" cx="50%" cy="40%" r="64%">
      <stop offset="0" stop-color="#2f433d"/>
      <stop offset=".6" stop-color="#17282a"/>
      <stop offset="1" stop-color="#091719"/>
    </radialGradient>
    <linearGradient id="ec-ouro" x1="24" y1="20" x2="176" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e4b0"/>
      <stop offset=".45" stop-color="#d9ad55"/>
      <stop offset="1" stop-color="#8b6127"/>
    </linearGradient>
    <linearGradient id="ec-luz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6e8c0"/>
      <stop offset="1" stop-color="#6fd3e8"/>
    </linearGradient>
    <filter id="ec-brilho" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="88" fill="url(#ec-disc)"/>
  <circle cx="100" cy="100" r="88" stroke="url(#ec-ouro)" stroke-width="3"/>
  <circle cx="100" cy="100" r="79" stroke="#e8c878" stroke-opacity=".32" stroke-width="1"/>
  <circle cx="100" cy="100" r="66" stroke="#e8c878" stroke-opacity=".18" stroke-width="1" stroke-dasharray="1 5"/>

  <circle cx="100" cy="100" r="46" fill="#e8c878" opacity=".09" filter="url(#ec-brilho)"/>

  <g transform="translate(100 100)" fill="url(#ec-ouro)">
    <path d="M0-62 9-9 0 0-9-9Z"/>
    <path d="M0 62 9 9 0 0-9 9Z" opacity=".78"/>
    <path d="M62 0 9 9 0 0 9-9Z" opacity=".78"/>
    <path d="M-62 0-9 9 0 0-9-9Z" opacity=".9"/>
    <path d="M38-38 6-6 0 0-6-6Z" opacity=".5"/>
    <path d="M-38 38-6 6 0 0 6 6Z" opacity=".45"/>
    <path d="M38 38 6 6 0 0 6-6Z" opacity=".4"/>
    <path d="M-38-38-6-6 0 0-6 6Z" opacity=".42"/>
    <circle r="9" fill="#1b2d2b" stroke="url(#ec-ouro)" stroke-width="2.4"/>
    <circle r="3" fill="#fff1c6"/>
  </g>

  <g>
    <circle cx="100" cy="30" r="3.4" fill="url(#ec-luz)"/>
    <circle cx="160" cy="74" r="3" fill="#e8c878"/>
    <circle cx="139" cy="158" r="3.1" fill="#a8d98b"/>
    <circle cx="60" cy="158" r="3" fill="#e8c878" opacity=".8"/>
    <circle cx="40" cy="74" r="3.2" fill="#6fd3e8" opacity=".85"/>
  </g>

  <g fill="#f6e4b2" opacity=".75">
    <circle cx="74" cy="44" r="1.3"/><circle cx="128" cy="44" r="1.3"/>
    <circle cx="74" cy="156" r="1.3"/><circle cx="126" cy="156" r="1.3"/>
  </g>
</svg>
