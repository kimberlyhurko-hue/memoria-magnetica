<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Grande biblioteca antiga com estantes, pergaminhos e mapas">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#493323"/><stop offset="0.6" stop-color="#5b402b"/><stop offset="1" stop-color="#2c2019"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="28%" r="65%">
      <stop offset="0" stop-color="#f1d6a0" stop-opacity="0.55"/><stop offset="1" stop-color="#C19B68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d0"/><stop offset="1" stop-color="#e8c88d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#765033"/><stop offset="1" stop-color="#332419"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#hall)"/>
  <rect width="1600" height="900" fill="url(#light)"/>

  <!-- janelas altas arqueadas -->
  <g>
    <path d="M620 60 V260 Q620 380 720 380 Q820 380 820 260 V60Z" fill="url(#window)" opacity="0.95"/>
    <path d="M900 60 V260 Q900 380 1000 380 Q1100 380 1100 260 V60Z" fill="url(#window)" opacity="0.95"/>
    <path d="M720 62 V378 M1000 62 V378 M620 230 H820 M900 230 H1100" stroke="#493323" stroke-width="12"/>
  </g>
  <g fill="#f7e5b8" opacity="0.16">
    <path d="M650 300 L790 300 L1100 900 L760 900Z"/>
    <path d="M930 300 L1070 300 L1500 900 L1180 900Z"/>
  </g>

  <!-- estantes laterais -->
  <g>
    <rect x="40" y="70" width="450" height="650" fill="#3b291d"/>
    <rect x="1110" y="70" width="450" height="650" fill="#3b291d"/>
    <g fill="#332419">
      <rect x="40" y="230" width="450" height="16"/><rect x="40" y="400" width="450" height="16"/><rect x="40" y="570" width="450" height="16"/>
      <rect x="1110" y="230" width="450" height="16"/><rect x="1110" y="400" width="450" height="16"/><rect x="1110" y="570" width="450" height="16"/>
    </g>
    <g fill="#A47746">
      <rect x="60" y="100" width="24" height="120"/><rect x="92" y="118" width="20" height="102"/><rect x="120" y="92" width="30" height="128"/><rect x="158" y="110" width="22" height="110"/>
      <rect x="190" y="96" width="26" height="124"/><rect x="224" y="120" width="20" height="100"/><rect x="252" y="100" width="28" height="120"/><rect x="290" y="112" width="22" height="108"/>
      <rect x="320" y="94" width="30" height="126"/><rect x="360" y="116" width="20" height="104"/><rect x="388" y="102" width="26" height="118"/><rect x="424" y="110" width="22" height="110"/>
      <rect x="60" y="262" width="26" height="128"/><rect x="96" y="280" width="20" height="110"/><rect x="124" y="256" width="30" height="134"/><rect x="164" y="276" width="22" height="114"/>
      <rect x="196" y="262" width="26" height="128"/><rect x="232" y="284" width="20" height="106"/><rect x="262" y="260" width="28" height="130"/><rect x="300" y="274" width="22" height="116"/>
      <rect x="332" y="258" width="30" height="132"/><rect x="372" y="280" width="20" height="110"/><rect x="400" y="264" width="26" height="126"/><rect x="436" y="276" width="22" height="114"/>
    </g>
    <g fill="#765033">
      <rect x="1130" y="100" width="26" height="120"/><rect x="1166" y="118" width="20" height="102"/><rect x="1194" y="92" width="30" height="128"/><rect x="1232" y="110" width="22" height="110"/>
      <rect x="1264" y="96" width="26" height="124"/><rect x="1300" y="120" width="20" height="100"/><rect x="1328" y="100" width="28" height="120"/><rect x="1366" y="112" width="22" height="108"/>
      <rect x="1396" y="94" width="30" height="126"/><rect x="1436" y="116" width="20" height="104"/><rect x="1464" y="102" width="26" height="118"/><rect x="1500" y="110" width="22" height="110"/>
      <rect x="1130" y="262" width="26" height="128"/><rect x="1166" y="280" width="20" height="110"/><rect x="1194" y="256" width="30" height="134"/><rect x="1232" y="276" width="22" height="114"/>
      <rect x="1264" y="262" width="26" height="128"/><rect x="1300" y="284" width="20" height="106"/><rect x="1330" y="260" width="28" height="130"/><rect x="1368" y="274" width="22" height="116"/>
      <rect x="1400" y="258" width="30" height="132"/><rect x="1440" y="280" width="20" height="110"/><rect x="1468" y="264" width="26" height="126"/><rect x="1504" y="276" width="22" height="114"/>
    </g>
  </g>

  <!-- piso em perspectiva -->
  <path d="M0 720 L1600 720 L1600 900 L0 900Z" fill="url(#floor)"/>
  <g stroke="#C19B68" stroke-width="2" opacity="0.22">
    <path d="M800 720 L0 900 M800 720 L300 900 M800 720 L600 900 M800 720 L1000 900 M800 720 L1300 900 M800 720 L1600 900"/>
  </g>

  <!-- mesa de leitura com pergaminhos e mapas -->
  <path d="M520 700 Q800 665 1080 700 L1120 900 L480 900Z" fill="#6b482e"/>
  <g transform="translate(630 706) rotate(-5)">
    <rect width="180" height="100" fill="#D8C49D" stroke="#8b6b48" stroke-width="3" rx="4"/>
    <path d="M20 30 H150 M20 52 H160 M20 74 H120" stroke="#a88c63" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 20 Q140 40 120 60 Q100 80 120 92" fill="none" stroke="#9b7b52" stroke-width="2"/>
  </g>
  <g transform="translate(880 716) rotate(6)">
    <rect width="160" height="96" fill="#e6d4ad" stroke="#8b6b48" stroke-width="3" rx="4"/>
    <circle cx="80" cy="48" r="28" fill="none" stroke="#a47746" stroke-width="2"/>
    <path d="M52 48 H108 M80 20 V76" stroke="#a47746" stroke-width="2"/>
    <path d="M30 80 Q80 60 130 84" fill="none" stroke="#a47746" stroke-width="2"/>
  </g>

  <!-- pó dourado -->
  <g fill="#f6e4bc">
    <circle cx="700" cy="220" r="2.6" opacity="0.8"/><circle cx="860" cy="320" r="2" opacity="0.65"/>
    <circle cx="980" cy="180" r="3" opacity="0.75"/><circle cx="560" cy="420" r="2" opacity="0.6"/>
    <circle cx="1060" cy="500" r="2.4" opacity="0.7"/><circle cx="760" cy="560" r="2" opacity="0.6"/>
    <circle cx="1300" cy="420" r="2.6" opacity="0.7"/><circle cx="320" cy="360" r="2" opacity="0.6"/>
  </g>
  <g fill="#ffe9b0" opacity="0.2" filter="url(#soft)">
    <circle cx="700" cy="220" r="18"/><circle cx="980" cy="180" r="20"/><circle cx="1060" cy="500" r="16"/>
  </g>
</svg>
