<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Oficina de invenções com engrenagens de bronze e mecanismos antigos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60452E"/><stop offset="0.55" stop-color="#3b2b22"/><stop offset="1" stop-color="#241d19"/>
    </linearGradient>
    <radialGradient id="warm" cx="48%" cy="42%" r="62%">
      <stop offset="0" stop-color="#D8A45D" stop-opacity="0.38"/><stop offset="1" stop-color="#D8A45D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b675"/><stop offset="0.45" stop-color="#A66C43"/><stop offset="1" stop-color="#5e3e29"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98a54"/><stop offset="0.5" stop-color="#8a5334"/><stop offset="1" stop-color="#4d3022"/>
    </linearGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#f0d6a2"/><stop offset="1" stop-color="#7d5433"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#warm)"/>

  <!-- prateleiras ao fundo -->
  <g opacity="0.35" fill="#241a15">
    <rect x="60" y="90" width="380" height="14"/><rect x="60" y="330" width="380" height="14"/><rect x="60" y="570" width="380" height="14"/>
    <rect x="1160" y="90" width="380" height="14"/><rect x="1160" y="330" width="380" height="14"/><rect x="1160" y="570" width="380" height="14"/>
  </g>
  <g fill="#A66C43" opacity="0.45">
    <circle cx="120" cy="60" r="26"/><circle cx="210" cy="50" r="18"/><circle cx="300" cy="62" r="22"/>
    <circle cx="1260" cy="60" r="24"/><circle cx="1360" cy="52" r="20"/><circle cx="1460" cy="64" r="26"/>
  </g>

  <!-- engrenagem grande -->
  <g transform="translate(520 450)">
    <circle r="270" fill="#D8A45D" opacity="0.12" filter="url(#glow)"/>
    <g fill="url(#brass)">
      <rect x="-26" y="-250" width="52" height="70" rx="6"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(30)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(60)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(90)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(120)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(150)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(180)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(210)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(240)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(270)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(300)"/>
      <rect x="-26" y="-250" width="52" height="70" rx="6" transform="rotate(330)"/>
      <circle r="205" fill="url(#brass)"/>
    </g>
    <circle r="160" fill="#4a3222"/>
    <circle r="150" fill="none" stroke="#B48A52" stroke-width="10"/>
    <g stroke="url(#copper)" stroke-width="16" stroke-linecap="round">
      <path d="M0 -140 V-60 M99 -99 L60 -60 M140 0 H60 M99 99 L60 60 M0 140 V60 M-99 99 L-60 60 M-140 0 H-60 M-99 -99 L-60 -60"/>
    </g>
    <circle r="52" fill="url(#hub)" stroke="#5e3e29" stroke-width="6"/>
    <circle r="18" fill="#3b2b22"/>
  </g>

  <!-- engrenagem pequena -->
  <g transform="translate(950 660)">
    <circle r="165" fill="#D8A45D" opacity="0.1" filter="url(#glow)"/>
    <g fill="url(#copper)">
      <rect x="-18" y="-150" width="36" height="48" rx="5"/>
      <rect x="-18" y="-150" width="36" height="48" rx="5" transform="rotate(45)"/>
      <rect x="-18" y="-150" width="36" height="48" rx="5" transform="rotate(90)"/>
      <rect x="-18" y="-150" width="36" height="48" rx="5" transform="rotate(135)"/>
      <rect x="-18" y="-150" width="36" height="48" rx="5" transform="rotate(180)"/>
      <rect x="-18" y="-150" width="36" height="48" rx="5" transform="rotate(225)"/>
      <rect x="-18" y="-150" width="36" height="48" rx="5" transform="rotate(270)"/>
      <rect x="-18" y="-150" width="36" height="48" rx="5" transform="rotate(315)"/>
      <circle r="125" fill="url(#copper)"/>
    </g>
    <circle r="88" fill="#3d2b20"/>
    <circle r="78" fill="none" stroke="#B48A52" stroke-width="7"/>
    <g stroke="#B48A52" stroke-width="12" stroke-linecap="round">
      <path d="M0 -70 V-30 M60 0 H25 M0 70 V30 M-60 0 H-25"/>
    </g>
    <circle r="30" fill="url(#hub)"/>
    <circle r="10" fill="#3b2b22"/>
  </g>

  <!-- relógio e instrumentos -->
  <g transform="translate(1250 350)">
    <circle r="140" fill="url(#brass)" stroke="#5e3e29" stroke-width="8"/>
    <circle r="118" fill="#e7d3a6"/>
    <circle r="104" fill="none" stroke="#8a6240" stroke-width="2"/>
    <g stroke="#7d5837" stroke-width="4">
      <path d="M0 -96 V-78 M0 96 V78 M-96 0 H-78 M96 0 H78 M68 -68 L54 -54 M-68 68 L-54 54 M68 68 L54 54 M-68 -68 L-54 -54"/>
    </g>
    <path d="M0 0 L0 -70 M0 0 L54 20" stroke="#4a3222" stroke-width="7" stroke-linecap="round"/>
    <circle r="10" fill="#4a3222"/>
  </g>

  <!-- eixos e correias -->
  <g fill="none" stroke="#B48A52" stroke-width="14" opacity="0.8">
    <path d="M740 300 Q900 200 1100 290"/>
    <path d="M620 720 Q780 820 930 760"/>
  </g>
  <g fill="#D8A45D" opacity="0.9">
    <circle cx="740" cy="300" r="12"/><circle cx="1100" cy="290" r="12"/><circle cx="930" cy="760" r="12"/>
  </g>
  <g fill="#ffe6ae" opacity="0.5">
    <circle cx="360" cy="200" r="3"/><circle cx="1400" cy="700" r="3"/><circle cx="820" cy="120" r="2.6"/><circle cx="1500" cy="180" r="2.6"/>
  </g>
</svg>
