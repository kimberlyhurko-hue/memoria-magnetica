<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Evolução dos suportes físicos: pintura rupestre, tabuletas, pergaminhos e livros">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6440"/><stop offset="0.45" stop-color="#76533A"/><stop offset="1" stop-color="#403024"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7650"/><stop offset="1" stop-color="#6d5036"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c19b68"/><stop offset="1" stop-color="#8a6541"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6b07c"/><stop offset="1" stop-color="#a47746"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- parede de caverna -->
  <path d="M0 0 H700 Q680 180 720 340 Q750 520 690 720 L0 900Z" fill="url(#rock)"/>
  <path d="M0 0 H700 Q680 180 720 340 Q750 520 690 720 L0 900Z" fill="none" stroke="#5a402c" stroke-width="10" opacity="0.4"/>
  <g fill="none" stroke="#5a402c" stroke-width="4" opacity="0.35">
    <path d="M40 120 Q200 90 360 140 M20 300 Q220 260 420 310 M60 520 Q240 480 480 540 M30 700 Q260 660 520 720"/>
  </g>

  <!-- pinturas rupestres: animais e mão -->
  <g fill="#8c4a2f" opacity="0.85">
    <path d="M150 330 Q180 285 250 290 Q300 292 320 320 Q350 315 360 338 Q340 350 316 346 Q310 390 290 420 L280 420 Q276 380 272 352 Q220 360 190 344 Q168 380 158 420 L146 420 Q150 370 150 330Z"/>
    <path d="M320 320 Q345 300 355 280 M320 330 Q348 330 366 348" fill="none" stroke="#8c4a2f" stroke-width="10" stroke-linecap="round"/>
    <path d="M430 480 Q460 440 520 446 Q565 450 585 474 Q620 468 630 490 Q606 502 580 498 Q572 540 550 568 L540 568 Q538 530 532 506 Q480 514 450 494 Q430 526 420 566 L408 566 Q414 518 430 480Z"/>
  </g>
  <g fill="#a85c39" opacity="0.8">
    <circle cx="140" cy="620" r="34"/>
    <path d="M112 598 L70 566 M118 612 L64 608 M126 626 L74 650 M138 636 L100 678 M164 630 L156 682 M174 620 L196 668 M180 606 L220 632 M176 592 L206 566" stroke="#a85c39" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g fill="#c98655" opacity="0.7">
    <circle cx="560" cy="180" r="10"/><circle cx="600" cy="210" r="7"/><circle cx="640" cy="170" r="8"/>
    <circle cx="520" cy="220" r="6"/><circle cx="680" cy="230" r="6"/>
  </g>

  <!-- chão -->
  <path d="M0 760 Q800 700 1600 780 L1600 900 L0 900Z" fill="url(#sand)"/>

  <!-- tabuleta de argila -->
  <g transform="translate(740 470) rotate(-4)">
    <rect width="250" height="300" rx="14" fill="url(#clay)" stroke="#8a6240" stroke-width="5"/>
    <g fill="none" stroke="#7d5837" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <path d="M40 60 L60 80 M40 80 L60 60 M90 60 H150 M180 60 L200 80 M180 80 L200 60"/>
      <path d="M40 120 H110 M130 120 L150 140 L170 120 M190 120 H210"/>
      <path d="M40 180 L60 200 L40 220 M90 180 V220 M120 180 L150 220 M150 180 L120 220"/>
      <path d="M40 260 H200 M60 240 V270 M180 240 V270"/>
    </g>
  </g>

  <!-- pergaminhos -->
  <g transform="translate(1040 690) rotate(6)">
    <rect x="20" width="230" height="120" fill="#e8d8b4" stroke="#9b7b52" stroke-width="3" rx="4"/>
    <path d="M20 0 Q0 20 20 40 M250 0 Q270 20 250 40 M20 80 Q0 100 20 120 M250 80 Q270 100 250 120" fill="#d8c49d" stroke="#9b7b52" stroke-width="3"/>
    <g stroke="#a88c63" stroke-width="3" stroke-linecap="round">
      <path d="M48 34 H206 M48 58 H224 M48 82 H180"/>
    </g>
  </g>
  <g transform="translate(1130 540) rotate(-8)">
    <rect width="120" height="150" fill="#ddc99f" stroke="#9b7b52" stroke-width="3" rx="3"/>
    <path d="M20 34 H96 M20 60 H100 M20 86 H80 M20 112 H96" stroke="#a88c63" stroke-width="3"/>
  </g>

  <!-- livros antigos -->
  <g transform="translate(1360 520)">
    <rect x="0" y="120" width="180" height="34" fill="#7a4f34" stroke="#5b3a25" stroke-width="3" rx="4"/>
    <rect x="8" y="86" width="170" height="34" fill="#a47746" stroke="#5b3a25" stroke-width="3" rx="4"/>
    <rect x="16" y="52" width="160" height="34" fill="#8b5f3c" stroke="#5b3a25" stroke-width="3" rx="4"/>
    <rect x="24" y="18" width="150" height="34" fill="#b48a52" stroke="#5b3a25" stroke-width="3" rx="4"/>
    <g stroke="#d8c49d" stroke-width="2" opacity="0.6">
      <path d="M40 137 H140 M46 103 H140 M54 69 H140 M62 35 H140"/>
    </g>
  </g>

  <g fill="#f2dcae" opacity="0.45">
    <circle cx="700" cy="240" r="24" fill="url(#soft)"/><circle cx="1180" cy="330" r="20" fill="url(#soft)"/>
    <circle cx="760" cy="200" r="2.6"/><circle cx="1240" cy="280" r="2.2"/><circle cx="1420" cy="420" r="2.4"/>
  </g>
</svg>
