<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa vertical ilustrado com sete ilhas ligadas por um caminho pontilhado">
  <defs>
    <linearGradient id="paperM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d3a2"/>
      <stop offset="0.5" stop-color="#e2cea2"/>
      <stop offset="1" stop-color="#c8af7d"/>
    </linearGradient>
    <radialGradient id="vignetteM" cx="50%" cy="48%" r="72%">
      <stop offset="0.55" stop-color="#5a4423" stop-opacity="0"/>
      <stop offset="1" stop-color="#4b331d" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="routeM" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6c7f3b"/>
      <stop offset="0.35" stop-color="#c98a36"/>
      <stop offset="0.72" stop-color="#b56a2c"/>
      <stop offset="1" stop-color="#2f8ea8"/>
    </linearGradient>
    <filter id="grainM">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
    </filter>
    <filter id="glowM"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="wavesM" width="78" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 22 Q16 9 32 22 T64 22 T96 22" fill="none" stroke="#2f6f7d" stroke-opacity="0.16" stroke-width="2"/>
    </pattern>
    <pattern id="gridM" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M88 0H0V88" fill="none" stroke="#6b522f" stroke-opacity="0.1"/>
    </pattern>
    <g id="shoreM">
      <path d="M-62 -12 C-58 -44 -26 -56 4 -48 C34 -58 68 -36 65 -6 C76 20 50 48 17 44 C-15 55 -56 38 -62 9 Z" fill="#bfa06a" stroke="#5a4423" stroke-width="3"/>
      <path d="M-53 -9 C-49 -35 -22 -45 4 -39 C32 -47 57 -29 55 -5 C64 18 44 39 15 36 C-12 45 -47 31 -53 7 Z" fill="#ead8ad"/>
      <path d="M-44 -6 C-40 -27 -19 -35 4 -30 C29 -38 47 -23 45 -4 C52 15 36 31 13 29 C-8 36 -39 25 -44 5 Z" fill="#8f9a5e" opacity="0.5"/>
    </g>
    <g id="treeM">
      <path d="M0 12 L0 -3" stroke="#5a4423" stroke-width="3" stroke-linecap="round"/>
      <path d="M-11 -3 Q0 -22 11 -3 Q7 7 0 7 Q-7 7 -11 -3Z" fill="#5d6b34"/>
    </g>
  </defs>

  <rect width="700" height="1400" fill="url(#paperM)"/>
  <rect width="700" height="1400" fill="url(#gridM)"/>
  <rect width="700" height="1400" fill="url(#wavesM)"/>
  <rect width="700" height="1400" filter="url(#grainM)" opacity="0.5" style="mix-blend-mode:multiply"/>

  <rect x="18" y="18" width="664" height="1364" rx="8" fill="none" stroke="#5a4423" stroke-opacity="0.7" stroke-width="3"/>
  <rect x="29" y="29" width="642" height="1342" rx="4" fill="none" stroke="#5a4423" stroke-opacity="0.42" stroke-width="1.5"/>
  <g fill="none" stroke="#5a4423" stroke-opacity="0.6" stroke-width="2">
    <path d="M42 88 Q42 42 88 42 M658 88 Q658 42 612 42 M42 1312 Q42 1358 88 1358 M658 1312 Q658 1358 612 1358"/>
  </g>

  <!-- rosa dos ventos -->
  <g transform="translate(568 1290) scale(.72)" opacity="0.72">
    <circle r="54" fill="none" stroke="#5a4423" stroke-width="2"/>
    <circle r="42" fill="none" stroke="#5a4423" stroke-opacity="0.5"/>
    <path d="M0 -62 L13 -13 L62 0 L13 13 L0 62 L-13 13 L-62 0 L-13 -13Z" fill="#c98a36" stroke="#5a4423" stroke-width="2"/>
    <path d="M0 -62 L13 -13 L0 0Z M62 0 L13 13 L0 0Z M0 62 L-13 13 L0 0Z M-62 0 L-13 -13 L0 0Z" fill="#f0dfb6" opacity="0.85"/>
    <circle r="7" fill="#5a4423"/>
  </g>

  <!-- ondas decorativas -->
  <g fill="none" stroke="#4f6f69" stroke-opacity="0.3" stroke-width="2">
    <path d="M80 330 q26 -17 52 0 q26 17 52 0 M80 350 q26 -17 52 0 q26 17 52 0"/>
    <path d="M470 960 q26 -17 52 0 q26 17 52 0 M470 980 q26 -17 52 0 q26 17 52 0"/>
    <path d="M90 720 q26 -17 52 0 q26 17 52 0"/>
    <path d="M430 120 q26 -17 52 0 q26 17 52 0"/>
  </g>

  <!-- caminho -->
  <path d="M170 1240 C300 1200 420 1160 480 1080 S300 980 190 900 S420 830 500 740 S300 650 180 560 S420 470 490 390 S330 270 260 190"
        fill="none" stroke="url(#routeM)" stroke-width="12" stroke-opacity="0.16" filter="url(#glowM)"/>
  <path d="M170 1240 C300 1200 420 1160 480 1080 S300 980 190 900 S420 830 500 740 S300 650 180 560 S420 470 490 390 S330 270 260 190"
        fill="none" stroke="url(#routeM)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 15"/>

  <g transform="translate(170 1240)">
    <use href="#shoreM"/>
    <use href="#treeM" transform="translate(-24 8) scale(.85)"/>
    <use href="#treeM" transform="translate(6 2) scale(1.05)"/>
    <use href="#treeM" transform="translate(30 12) scale(.75)"/>
  </g>
  <g transform="translate(480 1080) scale(1.04)">
    <use href="#shoreM"/>
    <use href="#treeM" transform="translate(-28 6) scale(1)"/>
    <use href="#treeM" transform="translate(28 6) scale(1.1)"/>
    <g fill="#5a4423" opacity="0.75"><ellipse cx="0" cy="16" rx="8" ry="7"/><circle cx="-9" cy="4" r="3.5"/><circle cx="1" cy="0" r="3.5"/><circle cx="10" cy="5" r="3.5"/></g>
  </g>
  <g transform="translate(190 900)">
    <use href="#shoreM"/>
    <path d="M-28 20 Q-24 -18 0 -25 Q24 -18 28 20Z" fill="#9a7a53" stroke="#5a4423" stroke-width="3"/>
    <path d="M-14 18 Q-11 -6 0 -11 Q11 -6 14 18Z" fill="#5d4a35"/>
  </g>
  <g transform="translate(500 740) scale(1.03)">
    <use href="#shoreM"/>
    <g stroke="#5a4423" stroke-width="2" fill="#f1dfb6">
      <rect x="-36" y="-24" width="72" height="42" rx="4"/>
      <path d="M-36 -11 H36 M-18 -24 V18 M0 -24 V18 M18 -24 V18"/>
    </g>
    <path d="M-26 -38 q14 -10 30 0 l-5 18 q-11 -5 -21 0z" fill="#e9d3a0" stroke="#5a4423" stroke-width="2"/>
  </g>
  <g transform="translate(180 560)">
    <use href="#shoreM"/>
    <g fill="none" stroke="#5a4423" stroke-width="5">
      <circle r="25" stroke-dasharray="7 5"/><circle r="10"/><circle r="3" fill="#5a4423"/>
    </g>
    <circle cx="-40" cy="16" r="8" fill="#a4763f" stroke="#5a4423" stroke-width="2"/>
  </g>
  <g transform="translate(490 390)">
    <use href="#shoreM"/>
    <g fill="none" stroke="#397b91" stroke-width="3" opacity="0.9">
      <path d="M-38 -15 H-15 V-28 H15 V-15 H38 M-38 15 H-15 V28 H15 V15 H38"/>
    </g>
    <rect x="-17" y="-12" width="34" height="24" rx="4" fill="#2d6680" stroke="#1d4b60" stroke-width="3"/>
    <g fill="#bfe6f1"><circle cx="-8" cy="-3" r="2.5"/><circle cx="7" cy="5" r="2.5"/></g>
  </g>
  <g transform="translate(260 190) scale(.95)">
    <use href="#shoreM"/>
    <g fill="#2f6f89" stroke="#1d4b60" stroke-width="2">
      <path d="M-22 20 L-15 -21 L0 -36 L15 -21 L22 20Z"/>
      <rect x="-34" y="15" width="68" height="14" rx="3"/>
    </g>
    <g fill="#cfeef7"><circle cx="0" cy="-24" r="3.5"/><circle cx="-10" cy="-6" r="2.5"/><circle cx="10" cy="2" r="2.5"/></g>
  </g>

  <rect width="700" height="1400" fill="url(#vignetteM)" pointer-events="none"/>
</svg>
